<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Билл-до — Сервис для выставления счетов на оплату</title>
    <meta name="description" content="Билл-до — онлайн-сервис для бухгалтеров и предпринимателей. Создавайте счета на оплату за минуту, скачивайте Excel и PDF." />
    <meta name="keywords" content="счет на оплату, выставить счет, бухгалтерия онлайн, скачать счет excel, счет pdf, для ИП, для ООО, бесплатно, сервис счетов" />
    <meta name="author" content="Билл-до" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://bill-do.ru/" />
    <meta name="theme-color" content="#1B2A2E" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="ru_RU" />
    <meta property="og:site_name" content="Билл-до" />
    <meta property="og:title" content="Билл-до — Счета на оплату за минуту" />
    <meta property="og:description" content="Создавайте профессиональные счета на оплату за минуту. Excel, PDF, журнал счетов." />
    <meta property="og:url" content="https://bill-do.ru/" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Билл-до — Счета на оплату за минуту" />
    <meta name="twitter:description" content="Создавайте профессиональные счета на оплату за минуту." />

    <!-- Performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&family=Inter:wght@300;400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

    <!-- Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "Билл-до",
      "url": "https://bill-do.ru",
      "applicationCategory": "BusinessApplication",
      "operatingSystem": "Web",
      "description": "Онлайн-сервис для выставления счетов на оплату для бухгалтеров и предпринимателей"
    }
    </script>

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/billdo.png" />

    <style>
      #splash-screen {
        position: fixed;
        top: 0; left: 0; right: 0; bottom: 0;
        background: #1B2A2E;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 99999;
        transition: opacity 0.4s ease;
      }
      #splash-screen.fade-out { opacity: 0; pointer-events: none; }
      #splash-screen img {
        width: 96px; height: 96px;
        border-radius: 24px;
        animation: splash-pulse 1.5s ease-in-out infinite;
      }
      #splash-screen .splash-title {
        font-family: 'Lora', serif;
        font-size: 28px;
        font-weight: 600;
        color: #fff;
        margin-top: 20px;
        letter-spacing: -0.5px;
      }
      #splash-screen .splash-sub {
        font-family: 'Inter', sans-serif;
        font-size: 13px;
        color: rgba(255,255,255,0.5);
        margin-top: 8px;
      }
      #splash-screen .splash-loader {
        width: 32px; height: 32px;
        border: 3px solid rgba(255,255,255,0.15);
        border-top-color: rgba(255,255,255,0.7);
        border-radius: 50%;
        margin-top: 32px;
        animation: splash-spin 0.8s linear infinite;
      }
      @keyframes splash-pulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.05); }
      }
      @keyframes splash-spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div id="splash-screen">
      <img src="/billdo.png" alt="Билл-до" />
      <div class="splash-title">Билл-до</div>
      <div class="splash-sub">Сервис для выставления счетов</div>
      <div class="splash-loader"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Hide splash when React mounts
      window.addEventListener('load', function() {
        setTimeout(function() {
          var splash = document.getElementById('splash-screen');
          if (splash) {
            splash.classList.add('fade-out');
            setTimeout(function() { splash.remove(); }, 500);
          }
        }, 3000);
      });
    </script>
  </body>
</html>
